name: catalog-guard

on:
  push:
  pull_request:

jobs:
  guard:
    runs-on: homelab-arc
    steps:
      - uses: actions/checkout@v4
      - name: Set up parser runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
      - name: Set up Bats parser runtime
        uses: bats-core/bats-action@4.0.0
        with:
          bats-version: 1.14.0
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false
      - name: Set up virtualenv
        run: |
          python3 -m venv --system-site-packages .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install Python dependencies
        run: python3 -m pip install numpy pytest
      - name: Report parser dependencies
        run: |
          node --version
          bats --version
      - name: Validate canonical catalog
        run: python3 guard/failure_mode_catalog_guard.py
      - name: Run Python tests
        run: python3 -m pytest guard/tests/ pipeline/tests/ -q
      - name: Replay committed L2 offline
        run: python3 pipeline/replay_l2.py
      - name: Run bats tests
        run: bats guard/tests/*.bats
      - name: Run bin/ tool bats tests (require-real-ci, land)
        # FM-361 claimed this step needs sibling repos (fleet, claude-codex,
        # fleet-dispatch) checked out and is persistently red on main without
        # them. Verified false by direct CI evidence (2026-08-19): a diagnostic
        # run of THIS exact step against the current main-based tree passed
        # 237/237, siblings absent, no checkout added -- see the catalog note
        # this PR files. bin/tests/test_add_failure_mode.bats's canonical-add
        # loop tests were never reading real sibling repos; make_staged_repo /
        # make_real_reconcile_repo build a complete synthetic fleet/claude-codex/
        # fleet-dispatch topology under the test's own tmpdir, which is what the
        # tool actually walks (it resolves siblings relative to itself, not to
        # any fixed workstation path). --print-output-on-failure is added here
        # only so a REAL future regression in this step prints $output instead
        # of just "[ "$status" -eq 0 ]' failed", which is what made the original
        # misdiagnosis possible -- the evidence for FM-361 was misattributed
        # from a different branch's unrelated failure and from main runs where
        # this step never actually executed (see catalog note).
        run: bats --print-output-on-failure bin/tests/*.bats
      - name: Reconcile L1 corpus (declared reduced check)
        # CI checks out only this repo, so four of the five sources are not on
        # disk here. The old form ran all five and waived the resulting PARTIAL,
        # which made this step green BECAUSE it could not see what it checks:
        # --allow-partial waives PARTIAL only, so a real shortfall (SHORT) in the
        # one source CI can actually read would fail -- but a shortfall in the
        # other four is invisible here permanently, waiver or not (issue #73).
        #
        # So this step now names its scope instead of waiving its blindness: it
        # reconciles homelab-canon, the source that IS checked out, with no
        # waiver in play. A drift between catalog/failure-modes.md and
        # pipeline/L1/homelab-canon.jsonl now fails CI outright, and the run
        # prints the four sources it did not check.
        #
        # STILL NOT CHECKED ANYWHERE IN CI: fleet-main, fleet-orch,
        # claude-codex-integration, fleet-dispatch-schema. Closing that needs the
        # sibling repos checked out on the runner; it is not in this workflow's
        # reach, and a green tick here must not be read as covering them.
        run: python3 pipeline/reconcile_l1.py --source homelab-canon
      - name: Validate L1 schema
        run: python3 pipeline/validate_l1.py
      - name: Verify enforcement
        # This runner checks out only this one repo: ~/projects does not
        # exist here at all, so of the 13 mapped source-roots.conf entries
        # only SELF (homelab-canon, this checkout's own root) resolves --
        # confirmed empirically, ROOTS: 1/13. And SELF's own L1 entries are
        # ALL enforcement:null (see conf/source-roots.conf's homelab-canon
        # comment), so even that one resolved root verifies zero real
        # paths. A root that resolves but checks nothing must not satisfy
        # --require-roots (that was the C4b bug: it counted resolution, not
        # use, so "1 present" read as "1 verified"). With the falsifiable
        # floor, this step now takes the HONEST branch instead: it prints
        # SKIPPED and exits 0 -- a declared "not checked here", never a
        # silent "0 phantoms" that implies something was.
        #
        # Two things this step DOES still check for real, everywhere
        # including here, with no dependency on any source repo being
        # present: (1) the corpus-wide enforcement-bearing-entry floor
        # (conf/enforcement-floor.conf) can't silently drop, so records
        # can't be deleted to make debt disappear; (2) the catalog/schema
        # gates in the steps above this one.
        #
        # Real phantom-discovery against all 13 mapped roots -- including
        # the known-phantoms.conf debt-ledger gate -- only ever runs where
        # ~/projects is actually populated (a dev workstation). Chosen
        # option: explicit SKIP over (a) a scheduled/pre-commit job on a
        # workstation with a "was this checked recently" CI assertion, or
        # (b) vendoring a manifest into this repo -- both are legitimate
        # but are follow-up infra work, not this PR's scope; a loud,
        # honest skip beats a vacuous pass either way it's resolved later.
        run: python3 guard/failure_mode_catalog_guard.py --verify-enforcement --require-roots 1
