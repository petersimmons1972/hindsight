name: catalog-guard

on:
  push:
  pull_request:

jobs:
  guard:
    runs-on: homelab-arc
    steps:
      - uses: actions/checkout@v4
      - name: Install numpy
        run: python3 -m pip install --user numpy
      - name: Update apt package index
        run: sudo apt-get update
      - name: Install bats
        run: sudo apt-get install -y bats
      - name: Validate canonical catalog
        run: python3 guard/failure_mode_catalog_guard.py
      - name: Run Python tests
        run: python3 -m pytest guard/tests/ pipeline/tests/ -q
      - name: Run bats tests
        run: bats guard/tests/*.bats
      - name: Reconcile L1 corpus
        run: python3 pipeline/reconcile_l1.py
      - name: Validate L1 schema when available
        run: |
          if [ -f pipeline/validate_l1.py ]; then
            python3 pipeline/validate_l1.py
          else
            echo "pipeline/validate_l1.py is not present yet; skipping"
          fi
      - name: Verify enforcement when available
        run: |
          if [ -f guard/tests/test_verify_enforcement.py ]; then
            python3 guard/failure_mode_catalog_guard.py --verify-enforcement
          else
            echo "--verify-enforcement is not present yet; skipping"
          fi
