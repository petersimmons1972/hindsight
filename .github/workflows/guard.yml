name: catalog-guard

on:
  push:
  pull_request:

jobs:
  guard:
    runs-on: homelab-arc
    steps:
      - uses: actions/checkout@v4
        with:
          # C4f (HIGH-1): fetch-depth 1 (the previous default) gives this
          # runner exactly ONE commit and no `origin/main` remote-tracking
          # ref at all. previous_floor_value()'s ref lookup then silently
          # fails to resolve origin/main, and its HEAD-history fallback
          # walks a "log" that (in a shallow, single-commit clone) contains
          # only the checked-out tip commit -- so the "previous" value it
          # reads back is the SAME commit's own content as "current",
          # always. The floor ratchet compared current >= previous, which
          # is trivially true when they're the same commit, so
          # check_floor_ratchet ran, found nothing to complain about, and
          # printed NOTHING -- CI green with the ratchet silently a no-op
          # on every single run. fetch-depth: 0 fetches full history for
          # all branches (per actions/checkout's own docs), so
          # `origin/main` genuinely resolves here and previous_floor_value
          # can see real prior commits instead of only the tip.
          fetch-depth: 0
      - name: Set up virtualenv
        run: |
          python3 -m venv --system-site-packages .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install Python dependencies
        run: python3 -m pip install numpy pytest
      - name: Update apt package index
        run: sudo apt-get update
      - name: Install bats
        run: sudo apt-get install -y bats
      - name: Validate canonical catalog
        run: python3 guard/failure_mode_catalog_guard.py
      - name: Run Python tests
        run: python3 -m pytest guard/tests/ pipeline/tests/ -q
      - name: Run bats tests
        run: bats guard/tests/*.bats
      - name: Run require-real-ci.sh bats tests
        run: bats bin/tests/*.bats
      - name: Reconcile L1 corpus
        run: python3 pipeline/reconcile_l1.py
      - name: Validate L1 schema
        run: python3 pipeline/validate_l1.py
      - name: Verify enforcement attestation
        # C4g: five successive rounds (C4b..C4f) each closed one
        # manufactured-green layer -- data, config, control flow,
        # environment, scope -- and the pressure just found the next one.
        # The structural problem was never any single check: this runner
        # checks out only this one repo, ~/projects does not exist here at
        # all, and NO check that needs the mapped source repos can ever run
        # here, no matter how it's gated. Every previous round's fix
        # (--ci-no-source-repos, the CHECKED-FLOOR exemption, --require-roots)
        # was still CI pretending to run a check it structurally cannot --
        # the shortest path to "CI green, nothing verified" was ONE config
        # edit (repoint conf/source-roots.conf's non-SELF roots to decoys),
        # because CI had no way to tell a real 0 apart from a manufactured
        # one.
        #
        # So CI no longer runs the real check at all. It verifies a
        # committed ATTESTATION instead: a workstation with the mapped
        # source repos actually checked out runs the full verification
        # (`--write-attestation`, driven by the exact same run_verification()
        # this step used to call directly) and, only on a genuinely clean
        # result, writes attestation/enforcement-attestation.json recording
        # a config_digest -- a hash over the exact bytes of every
        # scope-defining input: conf/source-roots.conf,
        # conf/unmapped-sources.conf, all three floor files,
        # conf/known-phantoms.conf, and pipeline/L1/*.jsonl.
        #
        # This step recomputes that same digest from the CURRENT working
        # tree and fails unless it matches -- the one-file decoy-roots
        # attack changes conf/source-roots.conf, so the digest no longer
        # matches, and this step demands a fresh real run instead of
        # accepting the stale claim. It also fails if the attestation is
        # missing, older than --max-attestation-age-days, or its recorded
        # results (checked count, enforcement-bearing count, mapped-source
        # count, undocumented-phantom count) violate the floors loaded
        # FRESH from conf/*.conf here -- never trusting the attestation's
        # own "floors" section, which (unlike config_digest) isn't bound to
        # anything and could be hand-edited without touching a single
        # config file.
        #
        # What this deliberately does NOT defend against: someone forging
        # a SHA-256 preimage by hand to fake a matching config_digest
        # without ever running a real check. That is a different threat
        # (deliberate cryptographic forgery) and out of scope -- the
        # binding closes "an ordinary edit or a lazy optimization slips
        # through unnoticed," not "a determined attacker with a hash
        # collision."
        #
        # Regenerating is meant to be the path of least resistance, not an
        # afterthought: .githooks/pre-commit regenerates the attestation
        # automatically whenever any of the files above are staged. The
        # one command a human runs by hand if that ever needs doing
        # manually: `python3 guard/failure_mode_catalog_guard.py
        # --write-attestation`.
        run: python3 guard/failure_mode_catalog_guard.py --verify-attestation
