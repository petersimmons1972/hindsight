name: catalog-guard

on:
  push:
  pull_request:

jobs:
  guard:
    runs-on: homelab-arc
    steps:
      - uses: actions/checkout@v4
        with:
          # C4f (HIGH-1): fetch-depth 1 (the previous default) gives this
          # runner exactly ONE commit and no `origin/main` remote-tracking
          # ref at all. previous_floor_value()'s ref lookup then silently
          # fails to resolve origin/main, and its HEAD-history fallback
          # walks a "log" that (in a shallow, single-commit clone) contains
          # only the checked-out tip commit -- so the "previous" value it
          # reads back is the SAME commit's own content as "current",
          # always. The floor ratchet compared current >= previous, which
          # is trivially true when they're the same commit, so
          # check_floor_ratchet ran, found nothing to complain about, and
          # printed NOTHING -- CI green with the ratchet silently a no-op
          # on every single run. fetch-depth: 0 fetches full history for
          # all branches (per actions/checkout's own docs), so
          # `origin/main` genuinely resolves here and previous_floor_value
          # can see real prior commits instead of only the tip.
          fetch-depth: 0
      - name: Set up virtualenv
        run: |
          python3 -m venv --system-site-packages .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install Python dependencies
        run: python3 -m pip install numpy pytest
      - name: Update apt package index
        run: sudo apt-get update
      - name: Install bats
        run: sudo apt-get install -y bats
      - name: Validate canonical catalog
        run: python3 guard/failure_mode_catalog_guard.py
      - name: Run Python tests
        run: python3 -m pytest guard/tests/ pipeline/tests/ -q
      - name: Run bats tests
        run: bats guard/tests/*.bats
      - name: Run require-real-ci.sh bats tests
        run: bats bin/tests/*.bats
      - name: Reconcile L1 corpus
        run: python3 pipeline/reconcile_l1.py
      - name: Validate L1 schema
        run: python3 pipeline/validate_l1.py
      - name: Verify enforcement
        # This runner checks out only this one repo: ~/projects does not
        # exist here at all, so of the 13 mapped source-roots.conf entries
        # only SELF (homelab-canon, this checkout's own root) resolves --
        # confirmed empirically, ROOTS: 1/13. And SELF's own L1 entries are
        # ALL enforcement:null (see conf/source-roots.conf's homelab-canon
        # comment), so even that one resolved root verifies zero real
        # paths. A root that resolves but checks nothing must not satisfy
        # --require-roots (that was the C4b bug: it counted resolution, not
        # use, so "1 present" read as "1 verified"). With the falsifiable
        # floor, this step now takes the HONEST branch instead: it prints
        # SKIPPED and exits 0 -- a declared "not checked here", never a
        # silent "0 phantoms" that implies something was.
        #
        # C4f (HIGH-2): --ci-no-source-repos is what actually grants the
        # CHECKED-FLOOR exemption below -- NOT ~/projects being absent.
        # default_projects_dir() is Path.home()/"projects", and Path.home()
        # reads $HOME; a caller-controlled environment (HOME=/tmp/whatever,
        # or any workstation that simply lacks ~/projects) could otherwise
        # trip the same exemption with zero config or code edits, on a
        # fully populated checkout, verifying nothing while claiming the
        # honest-CI-skip message. This flag is the visible, committed,
        # reviewable declaration that THIS pinned job -- not any ad hoc
        # invocation -- structurally has no source repos checked out.
        #
        # Two things this step DOES still check for real, everywhere
        # including here, with no dependency on any source repo being
        # present: (1) the corpus-wide enforcement-bearing-entry floor
        # (conf/enforcement-floor.conf) can't silently drop, so records
        # can't be deleted to make debt disappear; (2) the catalog/schema
        # gates in the steps above this one; (3) the floor ratchet itself
        # (mapped-sources-floor, enforcement-floor, checked-floor must only
        # ever increase relative to origin/main), now able to actually
        # evaluate here because the checkout step above fetches full
        # history (fetch-depth: 0), so origin/main genuinely resolves.
        #
        # Real phantom-discovery against all 13 mapped roots -- including
        # the known-phantoms.conf debt-ledger gate -- only ever runs where
        # ~/projects is actually populated (a dev workstation). Chosen
        # option: explicit SKIP over (a) a scheduled/pre-commit job on a
        # workstation with a "was this checked recently" CI assertion, or
        # (b) vendoring a manifest into this repo -- both are legitimate
        # but are follow-up infra work, not this PR's scope; a loud,
        # honest skip beats a vacuous pass either way it's resolved later.
        run: python3 guard/failure_mode_catalog_guard.py --verify-enforcement --require-roots 1 --ci-no-source-repos
