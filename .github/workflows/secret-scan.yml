name: secret-scan

# Separate from guard.yml on purpose: guard.yml's shard contract
# (guard/tests/ci_workflow_contract.bash) parses every step in that file and
# bin/require-real-ci.sh pins its check names, so a new job there would be
# read as a shard step.
on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: homelab-arc
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
