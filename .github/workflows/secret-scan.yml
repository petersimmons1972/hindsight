name: secret-scan

# Separate from guard.yml on purpose: guard.yml's shard contract
# (guard/tests/ci_workflow_contract.bash) parses every step in that file and
# bin/require-real-ci.sh pins its check names, so a new job there would be
# read as a shard step.
#
# Runs the gitleaks CLI through bin/secret-scan.sh rather than
# gitleaks/gitleaks-action: the action scans `--no-merges --first-parent`, so
# a secret that reaches a PR through a merged side branch is never read. The
# script scans every commit in the range (merge resolutions included) and
# honors the reviewed false positives in .gitleaksignore.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: homelab-arc
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=x64 ;;
            aarch64 | arm64) arch=arm64 ;;
            *) echo "unsupported runner arch: $(uname -m)" >&2; exit 1 ;;
          esac
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_${arch}.tar.gz"
          sums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          cd "$dir"
          curl -fsSLO "$url/$tarball"
          curl -fsSLO "$url/$sums"
          # Fails if the tarball has no line in the release checksums or differs.
          grep -E "  ${tarball}\$" "$sums" | sha256sum --check --strict -
          tar -xzf "$tarball" gitleaks
          ./gitleaks version
          echo "$dir" >> "$GITHUB_PATH"
      - name: Scan new commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          PUSH_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            bash bin/secret-scan.sh pr "$PR_BASE" "$PR_HEAD"
          else
            bash bin/secret-scan.sh push "$PUSH_BEFORE" "$PUSH_AFTER" "$PUSH_BRANCH"
          fi
