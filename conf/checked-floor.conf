# Minimum acceptable count of `auto: machine` L1 entries actually run
# through the exists() check against a resolved source root (C4d, D2).
#
# conf/enforcement-floor.conf is deliberately root-independent (see
# total_enforcement_bearing()'s docstring) so it's computable in ANY
# environment -- but that same property makes it paddable: a new
# enforcement-bearing entry in an unmapped or not-checked-out source raises
# that floor's count by 1 without the entry ever being verified, pre-paying
# headroom that could later offset deleting a genuinely CHECKED entry
# elsewhere. This floor is scoped to `checked` specifically (see
# SourceTotals.checked) -- units actually resolved against their own
# source's root, whether they turned out enforced or phantom -- so padding
# an unverifiable source cannot buy cover for shrinking real, verified
# coverage.
#
# Only meaningful, and only enforced, in an environment where at least one
# root usefully resolved (see `useful_count` in main()) -- an environment
# that cannot check anything (CI with no source repos) legitimately has
# checked == 0 and takes the declared SKIP path instead, before this floor
# is ever consulted.
#
# Baseline recorded 2026-08-01 (C4d), computed with all 12 currently-mapped
# source repos checked out under ~/projects, AFTER fleet-dispatch-schema was
# demapped (D3): 23. (C4c's total of 33 checked entries included 10 from
# fleet-dispatch-schema under its now-forbidden "." root; those 10 are still
# counted in the enforcement-bearing floor, just no longer in this one.)
#
# Raise it whenever new machine entries actually get checked. Lower it ONLY
# with an explicit, recorded reason -- never as a side effect of an L1 or
# source-roots.conf edit that happens to make checked entries disappear.
23
