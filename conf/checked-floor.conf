# Minimum acceptable count of `auto: machine` L1 entries actually run
# through the exists() check against a resolved source root (C4d, D2).
#
# conf/enforcement-floor.conf is deliberately root-independent (see
# total_enforcement_bearing()'s docstring) so it's computable in ANY
# environment -- but that same property makes it paddable: a new
# enforcement-bearing entry in an unmapped or not-checked-out source raises
# that floor's count by 1 without the entry ever being verified, pre-paying
# headroom that could later offset deleting a genuinely CHECKED entry
# elsewhere. This floor is scoped to `checked` specifically (see
# SourceTotals.checked) -- units actually resolved against their own
# source's root, whether they turned out enforced or phantom -- so padding
# an unverifiable source cannot buy cover for shrinking real, verified
# coverage.
#
# C4e: fully enforced whenever ~/projects exists on disk at all (including
# a workstation whose source-roots.conf/unmapped-sources.conf were narrowed
# down to nothing useful -- narrowing config on a populated workstation is
# NOT the same as ~/projects genuinely being absent, and must not exempt
# this floor). The ONLY exemption is an environment where ~/projects does
# not exist on disk AT ALL -- the real CI runner's own shape, which checks
# out just this one repo (see .github/workflows/guard.yml's "Verify
# enforcement" step comment). See `structurally_cannot_check` in main().
#
# This floor may also only ever INCREASE relative to what's committed at
# origin/main (see previous_floor_value/check_floor_ratchet in
# guard/failure_mode_catalog_guard.py) -- a decrease requires
# --allow-floor-decrease checked-floor="<reason>" and a matching reason
# recorded here, same idiom as --accept-phantom.
#
# History:
#   - C4c: 33, computed with all 13 mapped source repos checked out
#     (fleet-dispatch-schema mapped to root "." at the time).
#   - C4d: dropped this to 23 in the SAME commit that demapped
#     fleet-dispatch-schema (D3, forbidding root "."), setting the ruler to
#     match the reduced reality instead of recording the drop as a
#     deliberate, reasoned, flagged decrease. C4e's adversarial review
#     flagged this as "a floor the same change can lower is not a floor."
#   - C4e: kept at 23, but now for a stated, evidenced reason rather than as
#     a side effect: fleet-dispatch-schema's 10 entries genuinely cannot be
#     mapped without editing pipeline/L1/ (out of scope for guard/+conf/
#     work). Verified directly (C4e): the file all 10 entries name,
#     `fleet-dispatch/migrations/0017_failure_class.sql`, exists ONLY at
#     `~/projects/fleet-dispatch/migrations/0017_failure_class.sql` --
#     fleet-dispatch is its own repo (confirmed: separate .git, remote
#     petersimmons1972/fleet-dispatch). Mapping fleet-dispatch-schema to
#     that root (fleet-dispatch-schema:fleet-dispatch) would resolve each
#     entry as `~/projects/fleet-dispatch/fleet-dispatch/migrations/...` --
#     doubling the "fleet-dispatch/" prefix baked into every enforcement.file
#     value by the original extraction -- and turn all 10 real, resolvable
#     entries into FALSE phantoms, which is worse than leaving them
#     UNVERIFIABLE. Phase-5 (recorded, not done here): strip the leading
#     "fleet-dispatch/" segment from all 10 enforcement.file values in
#     pipeline/L1/fleet-dispatch-schema.jsonl, then map
#     fleet-dispatch-schema:fleet-dispatch in conf/source-roots.conf and
#     raise this floor back to 33 in the same commit.
23
