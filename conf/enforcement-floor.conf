# Minimum acceptable count of L1 entries carrying a non-null enforcement
# value -- ANY entry, machine or judgment -- summed across ALL sources (enforced +
# phantom + unverifiable -- see total_enforcement_bearing() in
# guard/failure_mode_catalog_guard.py). This is a corpus-integrity floor,
# not a root-resolution check: it runs identically everywhere, CI included,
# with no dependency on any source repo being checked out.
#
# It exists to catch the fleet#152 defect: a debt ledger (known-phantoms.conf)
# can legitimately shrink because a phantom got fixed, or it can "shrink"
# because someone deleted the flagged L1 record (or nulled its enforcement
# field) instead of fixing anything. Only this floor not dropping tells
# those two apart.
#
# Raise it whenever new entries with real enforcement land (machine OR
# judgment -- issue #31 widened the counted population to both). Lower
# it ONLY with an explicit, recorded reason (e.g. a genuinely malformed
# entry reclassified out of the enforcement-bearing count) -- never as a
# side effect of an L1 edit that happens to make a phantom disappear.
#
# Baseline recorded 2026-08-01, machine-only: 33.
# Re-baselined 2026-08-03 (issue #31): the gate now counts judgment rows too,
# which added engram-go:eng-patternB and publishing-incidents:pub-fm-05.
# Leaving this at 33 against a population of 35 would have handed back exactly
# the fleet#152 slack this floor exists to remove.
# Re-baselined 2026-08-03 (issue #33, packet B2): hc-inc-007, hc-inc-008,
# and hc-les-11 were genuine phantoms and now carry honest null enforcement.
# Re-baselined 2026-08-03 (issue #33, packet A): hc-les-08 has no independent
# DNS TXT check, and eng-patternB names implementation source rather than an
# enforcement mechanism; both now carry honest null enforcement.
# Re-baselined 2026-08-03 (issue #33, packet C): eng-taxo-scorer_disagrees and
# fleet-orch-OPS-12 contained structurally invalid values rather than paths to
# real-shaped mechanisms; both now carry honest null enforcement.
# Re-baselined 2026-08-07 (hindsight#38 D+A): null ccx-FM-020/021/023 (node-lane
# canary/attach deleted by claude-codex#555); point fleet-OPS-49, fleet-OPS-31,
# fleet-ORC-15 at fleet declared-live-drift tool/tests. Net enforcement-bearing
# unchanged (28).
28
