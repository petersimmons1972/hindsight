# Minimum acceptable count of `auto: machine` L1 entries carrying a
# non-null enforcement value, summed across ALL sources (enforced +
# phantom + unverifiable -- see total_enforcement_bearing() in
# guard/failure_mode_catalog_guard.py). This is a corpus-integrity floor,
# not a root-resolution check: it runs identically everywhere, CI included,
# with no dependency on any source repo being checked out.
#
# It exists to catch the fleet#152 defect: a debt ledger (known-phantoms.conf)
# can legitimately shrink because a phantom got fixed, or it can "shrink"
# because someone deleted the flagged L1 record (or nulled its enforcement
# field) instead of fixing anything. Only this floor not dropping tells
# those two apart.
#
# Raise it whenever new machine entries with real enforcement land. Lower
# it ONLY with an explicit, recorded reason (e.g. a genuinely malformed
# entry reclassified out of the enforcement-bearing count) -- never as a
# side effect of an L1 edit that happens to make a phantom disappear.
#
# Baseline recorded 2026-08-01, computed with all 13 mapped source repos
# checked out (ROOTS 13/13): 33.
33
