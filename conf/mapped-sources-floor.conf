# Minimum acceptable count of entries in conf/source-roots.conf (C4d, D1).
#
# The ROOTS line guard/failure_mode_catalog_guard.py prints is a fraction
# (resolved / mapped) with NO floor of its own: deleting a line from
# source-roots.conf (or reducing the whole file to one trivially-satisfied
# entry) makes that source's phantoms UNVERIFIABLE, exits 0, and *improves*
# the reported ratio -- because the denominator shrinks right along with the
# numerator. This floor makes the map itself falsifiable, same idiom as
# conf/enforcement-floor.conf: it may grow when a new source gets a real,
# evidenced root, but may not shrink without an explicit, recorded reason
# here.
#
# Baseline recorded 2026-08-01 (C4d): 12. This is ONE LOWER than C4c's 13 --
# not a shrink-to-hide-debt, but the direct, documented consequence of D3:
# fleet-dispatch-schema's root of "." was forbidden (see conf/source-roots.conf
# and conf/unmapped-sources.conf) and it was demapped to a declared-unmappable
# source instead. Its 10 entries still count in the enforcement-bearing floor
# (conf/enforcement-floor.conf, root-independent by design) -- only the
# MAPPED count dropped, and this file's value was updated in the same commit
# that made the change, with this comment as the recorded reason.
#
# C4e: this floor may now only ever INCREASE relative to what's committed at
# origin/main (see previous_floor_value/check_floor_ratchet in
# guard/failure_mode_catalog_guard.py) -- any future decrease requires
# --allow-floor-decrease mapped-sources-floor="<reason>" plus a matching
# reason recorded here, same idiom as --accept-phantom.
12
