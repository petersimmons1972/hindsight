# hindsight source-roots -- maps each pipeline/L1/<source>.jsonl to the repo
# checkout its entries were extracted from, so guard/failure_mode_catalog_guard.py
# --verify-enforcement resolves each entry's enforcement.file against the RIGHT
# root instead of a single hardcoded ~/projects (the C4b contamination bug).
#
# Format: <source>:<path relative to ~/projects>
#
# Every mapping below was determined from EVIDENCE, not guessed: read a sample
# of the source's JSONL, took its source_path / enforcement.file values, and
# confirmed which directory under ~/projects actually contains them (see the
# C4b PR body for the verbatim `find`/`ls` output backing each line). A source
# with no line here has no established root and is UNVERIFIABLE by design --
# never a silently-assumed default.
#
# Deliberately OMITTED: model-tables, fleet-dispatch-schema. Both are
# declared unmappable, with reasons, in conf/unmapped-sources.conf --
# C4d closed the "unmapped source is a silent free pass" defect (D2), so an
# omission here is no longer allowed to be undocumented; every L1 source
# must appear either as a line in this file or as a declaration there.
# validate_source_coverage() in guard/failure_mode_catalog_guard.py enforces
# this at run time and fails loud if a source is in neither place.

# source_path prefix "claude-codex/" on every entry; consumers.conf confirms
# /home/psimmons/projects/claude-codex. Enforcement paths are bare tests/*.bats
# files, all confirmed to exist only on unmerged worktree branches, absent on
# the main checkout -- genuine phantoms, not a scoping artifact.
claude-codex-integration:claude-codex

# source_path prefix "codex/"; consumers.conf confirms the local path. No
# machine entry in this source currently carries a non-null enforcement value.
codex:codex

# source_path prefix "duramind/"; consumers.conf confirms the local path. No
# machine entry in this source currently carries a non-null enforcement value.
duramind:duramind

# source_path prefix "engram-go/"; consumers.conf confirms the local path;
# `score.go` and the v9-failure-taxonomy files were confirmed under this root.
engram-go:engram-go

# fleet-dispatch-schema was mapped here to "." (projects_dir itself, i.e.
# ~/projects) through C4c, on the reasoning that its enforcement.file values
# are recorded already ~/projects-relative (e.g. "fleet-dispatch/migrations/
# 0017_failure_class.sql", with the leading "fleet-dispatch/" baked in by the
# extraction, and pipeline/L1/ is out of scope to edit to strip it). C4d (D3)
# found that a root of "." structurally reopens the cross-repo leak this
# whole file exists to close: it makes literally ANY file anywhere under
# ~/projects -- substack/README.md, a sibling repo, anything -- resolve as
# "enforced" for this source, because every path under projects_dir is
# trivially "relative to" projects_dir. Demapped and declared unmappable
# instead (see conf/unmapped-sources.conf) pending a Phase-5 correction that
# strips the "fleet-dispatch/" prefix from these 10 L1 records so they can
# be mapped to fleet-dispatch:fleet-dispatch like every other source.

# source_path prefix "fleet/"; consumers.conf confirms the local path.
# dispatch/cli-dispatch, dispatch/tools/verify-land-claim.sh, and
# orchestration/test/adversarial-loop.test.js were all confirmed to exist
# under this root (previously misreported as phantom against ~/projects).
fleet-main:fleet

# Same repo as fleet-main: FAILURE-MODES.md / CODING-INVARIANTS.md /
# CODING-FAILURE-MODES.md all live under fleet/ and fleet/orchestration/, per
# reconcile_l1.py's own ENUMERABLE map, which this file's evidence agrees with.
fleet-orch:fleet

# source_path prefix "generals/"; consumers.conf confirms the local path.
# This source has zero "auto": "machine" entries today (all judgment), so the
# mapping affects nothing yet, but it's evidenced and kept for completeness.
generals:generals

# source_path prefix "hindsight/" -- this catalog's own repo, i.e. THIS
# checkout, not a sibling under ~/projects. Mapped to the special SELF
# token (resolved to this script's own repo root, see
# guard/failure_mode_catalog_guard.py::_resolve_source_root) rather than
# "~/projects/hindsight", because that path only happens to exist on a dev
# workstation that clones this repo there -- CI checks it out elsewhere
# entirely. SELF is the one root guaranteed to resolve in ANY environment
# running this check, CI included; every machine entry in this source
# currently has enforcement: null so it doesn't affect phantom detection
# today, but it's what keeps --require-roots satisfiable on a CI runner
# that structurally has none of the other 12 repos checked out.
homelab-canon:SELF

# source_path prefix "homelab-config/"; consumers.conf confirms the local
# path.
homelab-incidents:homelab-config

# Same repo as homelab-incidents (source_path prefix "homelab-config/").
# bin/health-check.sh confirmed to exist under this root (the two entries
# that named it recorded an absolute host path instead of this repo-relative
# one -- fixed in the L1 record, see PR body).
homelab-lessons:homelab-config

# source_path prefix "kubernetes/"; consumers.conf confirms the local path
# (remote petersimmons1972/homelab-kubernetes). No machine entry in this
# source currently carries a non-null enforcement value.
kubernetes-homepage:kubernetes

# This source draws from BOTH substack/ and clearwatch/ (mixed source_path
# prefixes), but every entry that carries a non-null enforcement.file is
# substack-anchored (docs/incidents/2026-07-21-scheduler-silent-stall.md and
# .../2026-07-31-scheduler-deploy-key-revoked.md), and bin/scheduler-
# watchdog.sh + bin/test_push_draft_tags.py were both confirmed to exist
# under ~/projects/substack. The one clearwatch-sourced entry (pub-001) has
# enforcement: null, so this root choice doesn't affect it.
publishing-incidents:substack
