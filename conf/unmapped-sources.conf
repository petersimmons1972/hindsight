# hindsight unmapped-sources declarations.
#
# C4d (D2): an L1 source with no line in conf/source-roots.conf used to be a
# silent, undocumented free pass -- nothing forced anyone to record WHY it has
# no root, and a new source could sit unmapped forever with no evidence anyone
# ever noticed. guard/failure_mode_catalog_guard.py::validate_source_coverage
# now requires every pipeline/L1/<source>.jsonl to appear EITHER as a line in
# conf/source-roots.conf OR as a line here -- never in neither. Being listed
# here does not make a source's entries enforced or checked: they remain
# UNVERIFIABLE forever, by design, and (per conf/checked-floor.conf) padding
# a declared-unmappable source with new enforcement-bearing entries cannot
# buy floor headroom against a genuinely checked entry being deleted
# elsewhere -- only the enforcement-bearing floor (root-independent, coarser)
# sees them; the checked floor never does.
#
# Fields per line (JSON object): source, reason.
{"source":"model-tables","reason":"source_path straddles TWO repos (aifleet/docs/model-failure-modes.md and a spark-derived entry) with no enforcement-bearing entry to disambiguate which one is authoritative; guessing one would be exactly the fabricated-mechanism failure this repo exists to catalogue. See conf/source-roots.conf's own note. Phase 5: split model-tables into per-repo sources with real roots."}
{"source":"fleet-dispatch-schema","reason":"C4d (D3): was mapped to root \".\" (projects_dir itself), which structurally reopens the cross-repo phantom leak this file exists to close (any path under ~/projects resolves as \"enforced\"). Its enforcement.file values are recorded ~/projects-relative with a baked-in \"fleet-dispatch/\" prefix, so mapping it to fleet-dispatch:fleet-dispatch instead would double the prefix and turn every entry into a false phantom -- and pipeline/L1/ is out of scope to edit to strip it in this PR. Demapped and declared unmappable pending a Phase-5 L1 path correction."}
